<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesan Kontak - Admin Panel</title>
    <link rel="stylesheet" href="../css/admin.css">
    <style>
        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .status-belum_dibaca {
            background: #ffc107;
            color: #000;
        }
        .status-sudah_dibaca {
            background: #28a745;
            color: white;
        }
        .message-detail {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            white-space: pre-wrap;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="logo">Admin Panel</div>
            <nav class="admin-nav">
                <a href="dashboard.html">Dashboard</a>
                <a href="berita.html">Kelola Berita</a>
                <a href="program.html">Kelola Program</a>
                <a href="ekskul.html">Kelola Ekskul</a>
                <a href="fasilitas.html">Kelola Fasilitas</a>
                <a href="slider.html">Kelola Slider</a>
                <a href="ppdb.html">Data PPDB</a>
                <a href="siswa.html">Data Siswa</a>
                <a href="kontak.html" class="active">Pesan Kontak</a>
                <a href="#" id="logout">Logout</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="content-header">
                <h1>Pesan Kontak</h1>
                <div>
                    <select id="filter-status" style="padding: 8px; border-radius: 5px; border: 1px solid #ddd;">
                        <option value="">Semua Status</option>
                        <option value="belum_dibaca">Belum Dibaca</option>
                        <option value="sudah_dibaca">Sudah Dibaca</option>
                    </select>
                </div>
            </header>

            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Tanggal</th>
                            <th>Nama</th>
                            <th>Email</th>
                            <th>Telepon</th>
                            <th>Subjek</th>
                            <th>Status</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="kontak-list"></tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Modal Detail -->
    <div id="modal-detail" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; padding: 20px; overflow-y: auto;">
        <div style="max-width: 700px; margin: 50px auto; background: white; border-radius: 10px; padding: 30px; position: relative;">
            <span onclick="closeModal()" style="position: absolute; top: 15px; right: 20px; font-size: 28px; cursor: pointer; color: #999;">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/db-config.js"></script>
    <script src="../js/notification.js"></script>
    <script src="../js/admin-kontak.js"></script>
</body>
</html>
