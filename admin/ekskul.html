<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="../img/logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Ekskul - Admin</title>
    <link rel="stylesheet" href="../css/admin.css">
    <style>
        .ekskul-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .ekskul-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border: 1px solid #e5e7eb;
        }
        .ekskul-card-img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            display: block;
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
        }
        .ekskul-card-no-img {
            width: 100%;
            height: 160px;
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
        }
        .ekskul-card-body {
            padding: 15px;
        }
        .ekskul-card-body h3 {
            font-size: 15px;
            font-weight: 600;
            margin: 0 0 6px;
            color: #1e293b;
        }
        .ekskul-card-body p {
            font-size: 13px;
            color: #64748b;
            margin: 0 0 12px;
            line-height: 1.5;
        }
        .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 6px;
        }
        .badge-aktif { background: #dcfce7; color: #16a34a; }
        .badge-nonaktif { background: #fee2e2; color: #dc2626; }
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: white;
            border-radius: 12px;
            padding: 30px;
            width: 480px;
            max-width: 95vw;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-box h3 { margin: 0 0 20px; font-size: 18px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 14px; color: #374151; }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .form-group textarea { height: 80px; resize: vertical; }
        .upload-area {
            border: 2px dashed #d1d5db;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .upload-area:hover { border-color: #2563eb; background: #eff6ff; }
        .upload-area p { margin: 0; color: #6b7280; font-size: 14px; }
        .upload-area small { color: #9ca3af; font-size: 12px; }
        .img-preview {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            margin-top: 10px;
            display: none;
        }
        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #e5e7eb;
        }
    </style>
</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="logo"><img src="../img/logo.png" style="width:30px;height:30px;object-fit:contain;vertical-align:middle;margin-right:8px;">SDIT Al-Madinah</div>
            <nav class="admin-nav">
                <a href="dashboard.html">Dashboard</a>
                <a href="berita.html">Kelola Berita</a>
                <a href="program.html">Kelola Program</a>
                <a href="ekskul.html" class="active">Kelola Ekskul</a>
                <a href="fasilitas.html">Kelola Fasilitas</a>
                <a href="slider.html">Kelola Slider</a>
                <a href="ppdb.html">Data PPDB</a>
                <a href="siswa.html">Data Siswa</a>
                <a href="kontak.html">Pesan Kontak</a>
                <a href="#" id="logout">Logout</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="content-header">
                <h1>Kelola Ekstrakurikuler</h1>
                <button class="btn-primary" onclick="openModal()">+ Tambah Ekskul</button>
            </header>

            <div id="ekskul-grid" class="ekskul-grid">
                <p>Memuat data...</p>
            </div>
        </main>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modal">
        <div class="modal-box">
            <h3 id="modal-title">Tambah Ekstrakurikuler</h3>
            <form id="ekskul-form">
                <input type="hidden" id="ekskul-id">
                <input type="hidden" id="ekskul-gambar-url">

                <div class="form-group">
                    <label>Nama Ekstrakurikuler *</label>
                    <input type="text" id="ekskul-nama" required placeholder="Contoh: Sepak Bola">
                </div>
                <div class="form-group">
                    <label>Deskripsi</label>
                    <textarea id="ekskul-deskripsi" placeholder="Deskripsi singkat..."></textarea>
                </div>
                <div class="form-group">
                    <label>Urutan Tampil</label>
                    <input type="number" id="ekskul-urutan" value="0" min="0">
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="ekskul-aktif">
                        <option value="true">Aktif</option>
                        <option value="false">Nonaktif</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Foto Ekskul</label>
                    <div class="upload-area" onclick="document.getElementById('file-ekskul').click()">
                        <p>📷 Klik untuk pilih foto</p>
                        <small>JPG/PNG, max 3MB</small>
                    </div>
                    <input type="file" id="file-ekskul" accept="image/*" style="display:none" onchange="previewImg(this)">
                    <img id="img-preview" class="img-preview" alt="Preview">
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn-secondary" onclick="closeModal()">Batal</button>
                    <button type="submit" class="btn-primary" id="btn-save">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/notification.js"></script>
    <script src="../js/admin-dashboard.js"></script>
    <script>
        if (!localStorage.getItem('isLoggedIn')) window.location.href = '../login.html';

        async function loadEkskul() {
            const grid = document.getElementById('ekskul-grid');
            const { data, error } = await window.supabaseClient
                .from('ekskul')
                .select('*')
                .order('urutan', { ascending: true });

            if (error) { grid.innerHTML = '<p style="color:red">Gagal memuat data: ' + error.message + '</p>'; return; }
            if (!data.length) { grid.innerHTML = '<p>Belum ada data ekskul. Klik "+ Tambah Ekskul" untuk menambahkan.</p>'; return; }

            grid.innerHTML = data.map(e => `
                <div class="ekskul-card">
                    ${e.gambar_url
                        ? `<img src="${e.gambar_url}" class="ekskul-card-img" alt="${e.nama}" onerror="this.style.display='none'">`
                        : `<div class="ekskul-card-no-img">🏃</div>`
                    }
                    <div class="ekskul-card-body">
                        <h3>${e.nama} <span class="badge ${e.aktif ? 'badge-aktif' : 'badge-nonaktif'}">${e.aktif ? 'Aktif' : 'Nonaktif'}</span></h3>
                        <p>${e.deskripsi || '-'}</p>
                        <div style="display:flex; gap:8px;">
                            <button class="btn-primary" onclick="editEkskul(${e.id})" style="padding:6px 16px; font-size:13px;">Edit</button>
                            <button class="btn-danger" onclick="deleteEkskul(${e.id}, '${e.nama.replace(/'/g, "\\'")}')" style="padding:6px 16px; font-size:13px;">Hapus</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function openModal(reset = true) {
            if (reset) {
                document.getElementById('modal-title').textContent = 'Tambah Ekstrakurikuler';
                document.getElementById('ekskul-form').reset();
                document.getElementById('ekskul-id').value = '';
                document.getElementById('ekskul-gambar-url').value = '';
                document.getElementById('img-preview').style.display = 'none';
            }
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        function previewImg(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                const img = document.getElementById('img-preview');
                img.src = e.target.result;
                img.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }

        async function editEkskul(id) {
            const { data, error } = await window.supabaseClient.from('ekskul').select('*').eq('id', id).single();
            if (error) { showNotification('Gagal memuat data', 'error'); return; }

            document.getElementById('modal-title').textContent = 'Edit Ekstrakurikuler';
            document.getElementById('ekskul-id').value = data.id;
            document.getElementById('ekskul-nama').value = data.nama;
            document.getElementById('ekskul-deskripsi').value = data.deskripsi || '';
            document.getElementById('ekskul-urutan').value = data.urutan || 0;
            document.getElementById('ekskul-aktif').value = String(data.aktif);
            document.getElementById('ekskul-gambar-url').value = data.gambar_url || '';

            const img = document.getElementById('img-preview');
            if (data.gambar_url) { img.src = data.gambar_url; img.style.display = 'block'; }
            else { img.style.display = 'none'; }

            openModal(false);
        }

        document.getElementById('ekskul-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-save');
            btn.disabled = true;
            btn.textContent = 'Menyimpan...';

            try {
                const id = document.getElementById('ekskul-id').value;
                const fileInput = document.getElementById('file-ekskul');
                let gambarUrl = document.getElementById('ekskul-gambar-url').value;

                if (fileInput.files[0]) {
                    const file = fileInput.files[0];
                    if (file.size > 3 * 1024 * 1024) throw new Error('Foto maksimal 3MB');
                    const ext = file.name.split('.').pop();
                    const fileName = `ekskul_${Date.now()}.${ext}`;
                    const { error: upErr } = await window.supabaseClient.storage
                        .from('program-images').upload(fileName, file, { upsert: true });
                    if (upErr) throw upErr;
                    const { data: urlData } = window.supabaseClient.storage.from('program-images').getPublicUrl(fileName);
                    gambarUrl = urlData.publicUrl;
                }

                const payload = {
                    nama: document.getElementById('ekskul-nama').value,
                    deskripsi: document.getElementById('ekskul-deskripsi').value,
                    urutan: parseInt(document.getElementById('ekskul-urutan').value) || 0,
                    aktif: document.getElementById('ekskul-aktif').value === 'true',
                    gambar_url: gambarUrl || null
                };

                if (id) {
                    const { error } = await window.supabaseClient.from('ekskul').update(payload).eq('id', id);
                    if (error) throw error;
                    showNotification('Ekskul berhasil diupdate!', 'success');
                } else {
                    const { error } = await window.supabaseClient.from('ekskul').insert([payload]);
                    if (error) throw error;
                    showNotification('Ekskul berhasil ditambahkan!', 'success');
                }

                closeModal();
                loadEkskul();
            } catch (err) {
                showNotification('Gagal: ' + err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Simpan';
            }
        });

        async function deleteEkskul(id, nama) {
            if (!confirm(`Hapus ekskul "${nama}"?`)) return;
            const { error } = await window.supabaseClient.from('ekskul').delete().eq('id', id);
            if (error) { showNotification('Gagal menghapus', 'error'); return; }
            showNotification('Ekskul berhasil dihapus!', 'success');
            loadEkskul();
        }

        loadEkskul();
    </script>
</body>
</html>
