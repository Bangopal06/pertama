<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Berita - SMA Negeri 1</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/landing.css">
    <style>
        .article-container {
            max-width: 900px;
            margin: 100px auto 60px;
            padding: 0 20px;
        }
        
        .article-header {
            margin-bottom: 30px;
        }
        
        .article-meta {
            display: flex;
            gap: 20px;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 20px;
        }
        
        .article-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .article-title {
            font-size: 42px;
            color: #1e3a8a;
            margin-bottom: 15px;
            line-height: 1.3;
        }
        
        .article-category {
            display: inline-block;
            background: #1e3a8a;
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        
        .article-image {
            width: 100%;
            height: 500px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        
        .article-content {
            font-size: 18px;
            line-height: 1.8;
            color: #334155;
        }
        
        .article-content p {
            margin-bottom: 20px;
        }
        
        .article-content h2 {
            font-size: 32px;
            color: #1e3a8a;
            margin: 40px 0 20px;
        }
        
        .article-content h3 {
            font-size: 24px;
            color: #1e3a8a;
            margin: 30px 0 15px;
        }
        
        .back-button {
            display: inline-block;
            padding: 12px 24px;
            background: #1e3a8a;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 30px;
            transition: all 0.3s;
        }
        
        .back-button:hover {
            background: #3b82f6;
            transform: translateX(-5px);
        }
        
        .share-section {
            margin-top: 50px;
            padding-top: 30px;
            border-top: 2px solid #e2e8f0;
        }
        
        .share-section h3 {
            font-size: 20px;
            color: #1e3a8a;
            margin-bottom: 15px;
        }
        
        .share-buttons {
            display: flex;
            gap: 10px;
        }
        
        .share-btn {
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .share-fb { background: #1877f2; }
        .share-tw { background: #1da1f2; }
        .share-wa { background: #25d366; }
        
        .share-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .related-news {
            margin-top: 60px;
            padding-top: 40px;
            border-top: 2px solid #e2e8f0;
        }
        
        .related-news h3 {
            font-size: 28px;
            color: #1e3a8a;
            margin-bottom: 30px;
        }
        
        .related-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <span class="logo-icon">🎓</span>
                <span class="logo-text">SMA Negeri 1</span>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">Beranda</a></li>
                <li><a href="profil.html">Profil</a></li>
                <li><a href="program.html">Program</a></li>
                <li><a href="berita.html" class="active">Berita</a></li>
                <li><a href="ppdb.html">PPDB</a></li>
                <li><a href="kontak.html">Kontak</a></li>
                <li><a href="login.html" class="btn-login">Login</a></li>
            </ul>
        </div>
    </nav>

    <div class="article-container">
        <a href="berita.html" class="back-button">← Kembali ke Berita</a>
        
        <article>
            <div class="article-header">
                <span class="article-category" id="article-category">Loading...</span>
                <h1 class="article-title" id="article-title">Loading...</h1>
                <div class="article-meta">
                    <span>📅 <span id="article-date">Loading...</span></span>
                </div>
            </div>
            
            <img id="article-image" class="article-image" src="" alt="">
            
            <div class="article-content" id="article-content">
                <p>Loading...</p>
            </div>
            
            <div class="share-section">
                <h3>Bagikan Berita Ini</h3>
                <div class="share-buttons">
                    <a href="#" class="share-btn share-fb" id="share-fb" target="_blank">Facebook</a>
                    <a href="#" class="share-btn share-tw" id="share-tw" target="_blank">Twitter</a>
                    <a href="#" class="share-btn share-wa" id="share-wa" target="_blank">WhatsApp</a>
                </div>
            </div>
        </article>
        
        <div class="related-news">
            <h3>Berita Terkait</h3>
            <div class="related-grid" id="related-news"></div>
        </div>
    </div>

    <footer class="footer"></footer>

    <a href="https://wa.me/6281234567890" class="whatsapp-float" target="_blank">
        <span class="whatsapp-icon">💬</span>
    </a>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/berita-detail.js"></script>
</body>
</html>
