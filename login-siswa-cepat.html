<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Siswa Cepat - Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .debug-info {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
            font-size: 12px;
            font-family: monospace;
        }
        .success {
            color: green;
            font-weight: bold;
        }
        .error {
            color: red;
            font-weight: bold;
        }
        .info {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #2196f3;
        }
        .info h3 {
            color: #1976d2;
            margin-bottom: 10px;
            font-size: 16px;
        }
        .info p {
            color: #555;
            font-size: 14px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎓 Login Siswa (Test)</h1>
        <p class="subtitle">Masukkan NISN dan Password dari pendaftaran PPDB</p>
        
        <div class="info">
            <h3>ℹ️ Cara Login:</h3>
            <p>
                1. Masukkan <strong>NISN</strong> yang Anda gunakan saat daftar PPDB<br>
                2. Masukkan <strong>Password</strong> yang diberikan saat pendaftaran<br>
                3. Klik tombol Login<br>
                4. Anda akan otomatis masuk ke Portal Siswa
            </p>
        </div>
        
        <form id="login-form">
            <div class="form-group">
                <label for="nisn">NISN (Username)</label>
                <input type="text" id="nisn" placeholder="Contoh: 1234567890" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="text" id="password" placeholder="Password dari pendaftaran" required>
            </div>
            
            <button type="submit" id="btn-login">Login ke Portal Siswa</button>
        </form>
        
        <div class="debug-info" id="debug-info" style="display:none;"></div>
    </div>

    <script src="js/supabase-config.js"></script>
    <script>
        const debugDiv = document.getElementById('debug-info');
        const btnLogin = document.getElementById('btn-login');
        
        function showDebug(message, type = 'info') {
            debugDiv.style.display = 'block';
            const timestamp = new Date().toLocaleTimeString();
            debugDiv.innerHTML += `<div class="${type}">[${timestamp}] ${message}</div>`;
        }
        
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const nisn = document.getElementById('nisn').value.trim();
            const password = document.getElementById('password').value.trim();
            
            debugDiv.innerHTML = '';
            showDebug('🔍 Memulai proses login...', 'info');
            showDebug(`Username (NISN): ${nisn}`, 'info');
            
            btnLogin.disabled = true;
            btnLogin.textContent = 'Memproses...';
            
            try {
                showDebug('📡 Menghubungi database...', 'info');
                
                // Cari siswa berdasarkan NISN dan password
                const { data, error } = await window.supabaseClient
                    .from('ppdb')
                    .select('*')
                    .eq('nisn', nisn)
                    .eq('password', password)
                    .single();
                
                if (error) {
                    showDebug('❌ Error dari database: ' + error.message, 'error');
                    throw error;
                }
                
                if (!data) {
                    showDebug('❌ Data tidak ditemukan!', 'error');
                    alert('NISN atau Password salah!\n\nPastikan Anda sudah daftar PPDB dan menggunakan NISN + Password yang benar.');
                    btnLogin.disabled = false;
                    btnLogin.textContent = 'Login ke Portal Siswa';
                    return;
                }
                
                showDebug('✅ Data siswa ditemukan!', 'success');
                showDebug(`ID: ${data.id}`, 'info');
                showDebug(`Nama: ${data.nama}`, 'info');
                showDebug(`NISN: ${data.nisn}`, 'info');
                
                // Simpan ke localStorage
                localStorage.setItem('siswa_id', data.id);
                localStorage.setItem('siswa_nama', data.nama);
                localStorage.setItem('siswa_username', data.nisn);
                
                showDebug('💾 Data disimpan ke localStorage', 'success');
                showDebug('🚀 Redirect ke portal siswa...', 'success');
                
                // Redirect ke dashboard
                setTimeout(() => {
                    window.location.href = 'siswa/dashboard.html';
                }, 1000);
                
            } catch (error) {
                console.error('Error:', error);
                showDebug('❌ Terjadi kesalahan: ' + error.message, 'error');
                alert('Login gagal!\n\n' + error.message);
                btnLogin.disabled = false;
                btnLogin.textContent = 'Login ke Portal Siswa';
            }
        });
    </script>
</body>
</html>
