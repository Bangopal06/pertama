<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Slider</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }
        h1 {
            color: #333;
        }
        .slider-item {
            border: 2px solid #ddd;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            background: #fafafa;
        }
        .slider-item h3 {
            margin-top: 0;
            color: #2c3e50;
        }
        .info-row {
            margin: 10px 0;
            padding: 10px;
            background: white;
            border-radius: 5px;
        }
        .label {
            font-weight: bold;
            color: #555;
            display: inline-block;
            width: 150px;
        }
        .value {
            color: #333;
        }
        .url-box {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 5px;
            word-break: break-all;
            font-family: monospace;
            font-size: 12px;
            margin-top: 5px;
        }
        .test-image {
            margin-top: 15px;
            border: 2px solid #ddd;
            padding: 10px;
            background: white;
            border-radius: 5px;
        }
        .test-image img {
            max-width: 100%;
            height: auto;
            display: block;
            margin-top: 10px;
        }
        .error {
            color: red;
            font-weight: bold;
        }
        .success {
            color: green;
            font-weight: bold;
        }
        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 10px;
        }
        .btn:hover {
            background: #5568d3;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Debug Slider - Cek URL Gambar</h1>
        <button class="btn" onclick="loadSliderData()">🔄 Refresh Data</button>
        <button class="btn" onclick="window.location.href='admin/slider.html'">← Kembali ke Admin</button>
        
        <div id="results">
            <div class="loading">Loading...</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script>
        async function loadSliderData() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="loading">Loading data dari database...</div>';

            try {
                const { data: sliders, error } = await window.supabaseClient
                    .from('slider')
                    .select('*')
                    .order('urutan', { ascending: true });

                if (error) throw error;

                if (!sliders || sliders.length === 0) {
                    resultsDiv.innerHTML = '<p class="error">Tidak ada data slider di database!</p>';
                    return;
                }

                let html = `<h2>Total Slider: ${sliders.length}</h2>`;

                sliders.forEach((slider, index) => {
                    const isBase64 = slider.gambar_url && slider.gambar_url.startsWith('data:image');
                    const isSupabaseUrl = slider.gambar_url && slider.gambar_url.includes('supabase.co');
                    const isExternalUrl = slider.gambar_url && (slider.gambar_url.startsWith('http://') || slider.gambar_url.startsWith('https://'));
                    
                    let urlStatus = '';
                    if (isBase64) {
                        urlStatus = '<span class="error">❌ Base64 (Harus diupload ke Storage!)</span>';
                    } else if (isSupabaseUrl) {
                        urlStatus = '<span class="success">✅ Supabase Storage URL</span>';
                    } else if (isExternalUrl) {
                        urlStatus = '<span style="color: orange;">⚠️ External URL</span>';
                    } else {
                        urlStatus = '<span class="error">❌ URL Tidak Valid</span>';
                    }

                    html += `
                        <div class="slider-item">
                            <h3>Slide #${index + 1}: ${slider.judul} ${slider.subjudul}</h3>
                            
                            <div class="info-row">
                                <span class="label">ID:</span>
                                <span class="value">${slider.id}</span>
                            </div>
                            
                            <div class="info-row">
                                <span class="label">Deskripsi:</span>
                                <span class="value">${slider.deskripsi || '-'}</span>
                            </div>
                            
                            <div class="info-row">
                                <span class="label">Urutan:</span>
                                <span class="value">${slider.urutan}</span>
                            </div>
                            
                            <div class="info-row">
                                <span class="label">Status:</span>
                                <span class="value">${slider.aktif ? '✅ Aktif' : '❌ Nonaktif'}</span>
                            </div>
                            
                            <div class="info-row">
                                <span class="label">Link URL:</span>
                                <span class="value">${slider.link_url || '-'}</span>
                            </div>
                            
                            <div class="info-row">
                                <span class="label">Link Text:</span>
                                <span class="value">${slider.link_text || '-'}</span>
                            </div>
                            
                            <div class="info-row">
                                <span class="label">Status URL:</span>
                                <span class="value">${urlStatus}</span>
                            </div>
                            
                            <div class="info-row">
                                <span class="label">URL Gambar:</span>
                                <div class="url-box">${slider.gambar_url ? (isBase64 ? 'data:image/... (Base64 - ' + (slider.gambar_url.length / 1024).toFixed(2) + ' KB)' : slider.gambar_url) : 'KOSONG!'}</div>
                            </div>
                            
                            <div class="test-image">
                                <strong>Test Load Gambar:</strong>
                                ${slider.gambar_url ? `
                                    <img src="${slider.gambar_url}" 
                                         alt="${slider.judul}"
                                         onerror="this.parentElement.innerHTML='<p class=error>❌ Gambar gagal dimuat! URL tidak valid atau tidak bisa diakses.</p>'"
                                         onload="this.parentElement.insertAdjacentHTML('beforeend', '<p class=success>✅ Gambar berhasil dimuat!</p>')">
                                ` : '<p class="error">❌ Tidak ada URL gambar!</p>'}
                            </div>
                        </div>
                    `;
                });

                // Tambahkan info troubleshooting
                html += `
                    <div style="margin-top: 30px; padding: 20px; background: #fff3cd; border-radius: 8px; border-left: 4px solid #ffc107;">
                        <h3>🔧 Troubleshooting:</h3>
                        <ul>
                            <li>Jika URL adalah Base64: Gunakan tool migrasi atau upload ulang gambar</li>
                            <li>Jika URL Supabase tapi gambar tidak muncul: 
                                <ol>
                                    <li>Pastikan bucket "slider-images" sudah dibuat</li>
                                    <li>Pastikan bucket diset sebagai "Public"</li>
                                    <li>Jalankan FIX-STORAGE-POLICY.sql di Supabase SQL Editor</li>
                                </ol>
                            </li>
                            <li>Jika URL External tapi tidak muncul: Cek apakah URL masih valid</li>
                        </ul>
                    </div>
                `;

                resultsDiv.innerHTML = html;

            } catch (error) {
                console.error('Error:', error);
                resultsDiv.innerHTML = `
                    <div class="error">
                        <h3>❌ Error!</h3>
                        <p>${error.message}</p>
                        <pre>${JSON.stringify(error, null, 2)}</pre>
                    </div>
                `;
            }
        }

        // Auto load saat halaman dibuka
        window.addEventListener('DOMContentLoaded', loadSliderData);
    </script>
</body>
</html>
